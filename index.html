<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1D9E75">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Album 2026">
  <meta name="description" content="Panini World Cup 2026 Sticker Album Tracker">
  <title>Album Mundial 2026 · World Cup 2026 Album</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap');

    :root {
      --green: #1D9E75;
      --green-dark: #0F6E56;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #0a0a0a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }
    .bg-circle {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.18;
      animation: drift 12s ease-in-out infinite alternate;
    }
    .bg-circle:nth-child(1) { width: 500px; height: 500px; background: var(--green); top: -100px; left: -150px; animation-delay: 0s; }
    .bg-circle:nth-child(2) { width: 350px; height: 350px; background: #00c896; bottom: -80px; right: -80px; animation-delay: -4s; }
    .bg-circle:nth-child(3) { width: 250px; height: 250px; background: var(--green-dark); top: 40%; left: 50%; animation-delay: -8s; }

    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(30px, 20px) scale(1.08); }
    }

    .bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeUp 0.6s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .trophy {
      font-size: 64px;
      line-height: 1;
      margin-bottom: 20px;
      animation: pop 0.5s cubic-bezier(0.34,1.56,0.64,1) 0.3s both;
      filter: drop-shadow(0 0 24px rgba(29,158,117,0.5));
    }
    @keyframes pop {
      from { opacity: 0; transform: scale(0.5); }
      to   { opacity: 1; transform: scale(1); }
    }

    .title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 52px;
      letter-spacing: 2px;
      line-height: 1;
      text-align: center;
      margin-bottom: 6px;
      animation: fadeUp 0.5s ease 0.4s both;
    }
    .title span { color: var(--green); }

    .subtitle {
      font-size: 13px;
      color: rgba(255,255,255,0.45);
      letter-spacing: 3px;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 48px;
      animation: fadeUp 0.5s ease 0.5s both;
    }

    .lang-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
      margin-bottom: 16px;
      animation: fadeUp 0.5s ease 0.6s both;
    }

    .btns {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      animation: fadeUp 0.5s ease 0.7s both;
    }

    .lang-btn {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      padding: 18px 22px;
      background: rgba(255,255,255,0.05);
      border: 1.5px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      color: #fff;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .lang-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--green), var(--green-dark));
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .lang-btn:hover::before, .lang-btn:active::before { opacity: 1; }
    .lang-btn:hover { border-color: var(--green); transform: translateY(-2px); box-shadow: 0 8px 30px rgba(29,158,117,0.25); }
    .lang-btn:active { transform: translateY(0); }

    .lang-btn > * { position: relative; z-index: 1; }

    .flag { font-size: 36px; line-height: 1; flex-shrink: 0; }

    .lang-info { flex: 1; text-align: left; }
    .lang-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 26px;
      letter-spacing: 1px;
      line-height: 1;
    }
    .lang-desc { font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 2px; }

    .lang-arrow { font-size: 18px; color: rgba(255,255,255,0.3); transition: transform 0.2s, color 0.2s; }
    .lang-btn:hover .lang-arrow { transform: translateX(4px); color: #fff; }

    .footer {
      margin-top: 40px;
      font-size: 11px;
      color: rgba(255,255,255,0.2);
      text-align: center;
      letter-spacing: 1px;
      animation: fadeUp 0.5s ease 0.85s both;
    }
    .footer a { color: rgba(255,255,255,0.35); text-decoration: none; }
    .footer a:hover { color: var(--green); }
  </style>
</head>
<body>

<div class="bg">
  <div class="bg-circle"></div>
  <div class="bg-circle"></div>
  <div class="bg-circle"></div>
</div>

<div class="wrap">
  <div class="trophy">🏆</div>
  <div class="title">MUNDIAL <span>2026</span></div>
  <div class="subtitle">Panini Sticker Tracker</div>

  <div class="lang-label">Choose your language · Elegí tu idioma</div>

  <div class="btns">
    <a class="lang-btn" href="es/">
      <span class="flag">🇦🇷</span>
      <div class="lang-info">
        <div class="lang-name">Español</div>
        <div class="lang-desc">Versión en español</div>
      </div>
      <span class="lang-arrow">→</span>
    </a>

    <a class="lang-btn" href="en/">
      <span class="flag">🌐</span>
      <div class="lang-info">
        <div class="lang-name">English</div>
        <div class="lang-desc">English version</div>
      </div>
      <span class="lang-arrow">→</span>
    </a>
  </div>

  <div class="footer">
    Open source · <a href="https://github.com/Imprezwag/panini2026" target="_blank">GitHub</a>
  </div>
</div>

</body>
</html>
